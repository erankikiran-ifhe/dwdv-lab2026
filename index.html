    // Seeded Random Number Generator based on Student ID
    function pseudoRandom(seed) {
      let numericSeed = 0;
      for (let i = 0; i < seed.length; i++) {
        numericSeed += seed.charCodeAt(i);
      }
      return function() {
        let x = Math.sin(numericSeed++) * 10000;
        return x - Math.floor(x);
      };
    }

    // Pick 4 random questions from across all lab activities deterministically
    function getQuestionsForStudent(studentId) {
      const rng = pseudoRandom(studentId);
      const allQuestions = [];
      
      LAB_ACTIVITIES.forEach(activity => {
        activity.questions.forEach(q => {
          allQuestions.push({ lab: activity.lab, question: q });
        });
      });

      // Fisher-Yates Shuffle
      for (let i = allQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [allQuestions[i], allQuestions[j]] = [allQuestions[j], allQuestions[i]];
      }

      return allQuestions.slice(0, 4);
    }

    function App() {

      const [assignedQuestions, setAssignedQuestions] = useState([]);
      const [errorMsg, setErrorMsg] = useState('');

      useEffect(() => {
        const handleContextMenu = (e) => e.preventDefault();
        
        const handleKeyDown = (e) => {
          if (e.keyCode === 123) e.preventDefault();
          if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) e.preventDefault();
          if (e.ctrlKey && e.key.toUpperCase() === 'U') e.preventDefault();
          if (e.ctrlKey && ['C', 'X', 'A', 'S'].includes(e.key.toUpperCase())) e.preventDefault();
        };

        document.addEventListener('contextmenu', handleContextMenu);
        document.addEventListener('keydown', handleKeyDown);

        return () => {
          document.removeEventListener('contextmenu', handleContextMenu);
          document.removeEventListener('keydown', handleKeyDown);
        };
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        const formattedId = studentIdInput.trim().toUpperCase();

        if (!VALID_STUDENT_IDS.includes(formattedId)) {
          setErrorMsg('Invalid Student ID! Please check your ID and try again.');
          return;
        }

        setErrorMsg('');
        setActiveStudent(formattedId);
        setAssignedQuestions(getQuestionsForStudent(formattedId));
      };

      const handleLogout = () => {
        setActiveStudent(null);
        setStudentIdInput('');
        setAssignedQuestions([]);
      };

      return (

                          type="text"
                          className="form-control text-uppercase"
                          value={studentIdInput}
                          onChange={(e) => setStudentIdInput(e.target.value)}
                          placeholder="e.g. STD1001"
                          required

                      </div>
