<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Question Allocator</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Prevent text selection */
    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 1. Pre-populated Student Database
    const VALID_STUDENT_IDS = ["STD1001", "STD1002", "STD1003", "STD1004", "STD1005"];

    // 2. Lab Activities Pool (5 Activities)
    const LAB_ACTIVITIES = [
      {
        lab: "Lab 1: Python Basics",
        questions: [
          "Write a Python program to swap two variables without using a third variable.",
          "Create a function that checks whether a given string is a palindrome.",
          "Write a script to compute the factorial of a number using recursion."
        ]
      },
      {
        lab: "Lab 2: Data Structures",
        questions: [
          "Implement a custom Stack class using Python lists.",
          "Write a program to remove duplicate elements from a list while maintaining order.",
          "Create a dictionary of student marks and compute the average score."
        ]
      },
      {
        lab: "Lab 3: Object-Oriented Programming",
        questions: [
          "Design a BankAccount class with deposit, withdraw, and display operations.",
          "Implement inheritance demonstrating method overriding using Shape and Circle classes.",
          "Create a class to demonstrate private attributes and encapsulation."
        ]
      },
      {
        lab: "Lab 4: File Handling & Exceptions",
        questions: [
          "Write a program to count word frequencies in a given text file.",
          "Create a script that safely handles ZeroDivisionError and ValueError during user input.",
          "Write a program to append timestamped logs to a log file."
        ]
      },
      {
        lab: "Lab 5: Web Scraping & APIs",
        questions: [
          "Fetch JSON data from a public API endpoint and extract specific fields.",
          "Parse basic HTML content using BeautifulSoup to extract all links.",
          "Write a program to download images from a list of URLs."
        ]
      }
    ];

    // Simple deterministic PRNG based on Student ID (Ensures consistent questions upon refresh)
    function pseudoRandom(seed) {
      let numericSeed = 0;
      for (let i = 0; i < seed.length; i++) {
        numericSeed += seed.charCodeAt(i);
      }
      return function() {
        let x = Math.sin(numericSeed++) * 10000;
        return x - Math.floor(x);
      };
    }

    // Pick 4 random questions from the pooled lab activities
    function getQuestionsForStudent(studentId) {
      const rng = pseudoRandom(studentId);
      const allQuestions = [];
      
      LAB_ACTIVITIES.forEach(activity => {
        activity.questions.forEach(q => {
          allQuestions.push({ lab: activity.lab, question: q });
        });
      });

      // Fisher-Yates Shuffle using custom seed
      for (let i = allQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [allQuestions[i], allQuestions[j]] = [allQuestions[j], allQuestions[i]];
      }

      return allQuestions.slice(0, 4);
    }

    function App() {
      const [studentIdInput, setStudentIdInput] = useState('');
      const [activeStudent, setActiveStudent] = useState(null);
      const [assignedQuestions, setAssignedQuestions] = useState([]);
      const [errorMsg, setErrorMsg] = useState('');

      // Add security event listeners
      useEffect(() => {
        const handleContextMenu = (e) => e.preventDefault();
        
        const handleKeyDown = (e) => {
          // Disable F12
          if (e.keyCode === 123) e.preventDefault();
          // Disable Ctrl+Shift+I, J, C
          if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) e.preventDefault();
          // Disable Ctrl+U (View Source)
          if (e.ctrlKey && e.key.toUpperCase() === 'U') e.preventDefault();
          // Disable Ctrl+C, Ctrl+X, Ctrl+A, Ctrl+S
          if (e.ctrlKey && ['C', 'X', 'A', 'S'].includes(e.key.toUpperCase())) e.preventDefault();
        };

        document.addEventListener('contextmenu', handleContextMenu);
        document.addEventListener('keydown', handleKeyDown);

        return () => {
          document.removeEventListener('contextmenu', handleContextMenu);
          document.removeEventListener('keydown', handleKeyDown);
        };
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        const formattedId = studentIdInput.trim().toUpperCase();

        if (!VALID_STUDENT_IDS.includes(formattedId)) {
          setErrorMsg('Invalid Student ID! Please check your ID and try again.');
          return;
        }

        setErrorMsg('');
        setActiveStudent(formattedId);
        setAssignedQuestions(getQuestionsForStudent(formattedId));
      };

      const handleLogout = () => {
        setActiveStudent(null);
        setStudentIdInput('');
        setAssignedQuestions([]);
      };

      return (
        <div class="container py-5">
          {!activeStudent ? (
            <div className="row justify-content-center">
              <div className="col-md-5">
                <div className="card shadow">
                  <div className="card-header bg-primary text-white text-center">
                    <h4>Lab Exam Portal</h4>
                  </div>
                  <div className="card-body p-4">
                    {errorMsg && <div className="alert alert-danger">{errorMsg}</div>}
                    <form onSubmit={handleLogin}>
                      <div className="mb-3">
                        <label className="form-label">Enter Student ID Number:</label>
                        <input
                          type="text"
                          className="form-control text-uppercase"
                          value={studentIdInput}
                          onChange={(e) => setStudentIdInput(e.target.value)}
                          placeholder="e.g. STD1001"
                          required
                        />
                      </div>
                      <button type="submit" className="btn btn-primary w-100">
                        Get Assigned Questions
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="card shadow">
              <div className="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 className="m-0">Lab Question Paper</h4>
                <span className="badge bg-success fs-6">ID: {activeStudent}</span>
              </div>
              <div className="card-body p-4">
                <p className="text-muted">Below are your 4 randomly allocated lab questions:</p>
                <div className="list-group mb-4">
                  {assignedQuestions.map((item, index) => (
                    <div key={index} className="list-group-item p-3 mb-2 border rounded">
                      <div className="d-flex justify-content-between mb-1">
                        <h5 className="text-primary m-0">Question {index + 1}</h5>
                        <small className="text-muted fw-bold">{item.lab}</small>
                      </div>
                      <p className="fs-5 text-dark m-0">{item.question}</p>
                    </div>
                  ))}
                </div>
                <div className="text-center">
                  <button onClick={handleLogout} className="btn btn-secondary">
                    Exit Session
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
